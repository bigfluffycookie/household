services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
      POSTGRES_DB: household
    ports:
      - "5432:5432"
    volumes:
      - household_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d household"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  household_pg: